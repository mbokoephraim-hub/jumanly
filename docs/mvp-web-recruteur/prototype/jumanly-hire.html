<title>Jumanly Hire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Mise en page : menu flottant à gauche (modules) + barre flottante en haut (vues du module en pilule) + grille en blocs de 12 colonnes */
:root{
  --page:#EDF2E1; --grid:#E3EAD3; --card:#FFFFFF; --soft:#F5F8EE; --line:#E1E7D4; --line2:#CFD8C0;
  --ink:#0E1B17; --sapin:#0F3F37; --sapin2:#1A5B4F; --muted:#56665F; --faint:#8A978F;
  --lime:#A6F26B; --lime2:#C9F7A3; --limebg:#ECFADF; --feuille:#3DA14F;
  --s1:#DCEBFF; --s1f:#1F5FBF; --s2:#ECE4FF; --s2f:#5B3FC4; --s3:#FFE7CF; --s3f:#A4520B; --s4:#FFF1B3; --s4f:#7A5F00; --s5:#DDF6CA; --s5f:#2B6E1B;
  --alert:#FBE1DC; --alertf:#A8321E;
  --f-display:"Sora", "Segoe UI", system-ui, sans-serif; --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(15,63,55,.05), 0 8px 24px rgba(15,63,55,.06);
  --shadow-float:0 18px 50px rgba(9,40,34,.22);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--sapin);outline-offset:2px;border-radius:10px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:15px;height:15px}.ico.l{width:22px;height:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- Cadre : logo + options en haut, colonne d'icônes à gauche ---------- */
.app{min-height:100%;display:grid;grid-template-columns:56px minmax(0,1fr);grid-template-rows:auto 1fr;gap:18px 20px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:flex;align-items:center;gap:10px;height:54px;padding:0 18px 0 16px;border-radius:99px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;flex:none}
.logo svg{width:20px;height:27px;flex:none}.logo b{font:600 19px var(--f-display);letter-spacing:-.02em;color:var(--ink)}
.logo i{font-style:normal;font-size:11px;font-weight:600;background:var(--lime);color:var(--sapin);padding:2px 8px;border-radius:99px}
.topnav{margin:0 auto;display:flex;gap:2px;padding:5px;border-radius:99px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none;min-width:0}
.topnav::-webkit-scrollbar{display:none}
.topnav a{display:flex;align-items:center;gap:7px;height:44px;padding:0 16px;border-radius:99px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.topnav a:hover{background:var(--soft);color:var(--ink)}
.topnav a.on{background:var(--ink);color:#fff}
.topnav a .ico{width:16px;height:16px}
.topnav .cnt{font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:99px;display:grid;place-items:center;background:var(--lime);color:var(--sapin)}
.topr{display:flex;align-items:center;gap:8px;flex:none}
.ibtn{width:48px;height:48px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;position:relative;transition:transform .2s;flex:none}
.ibtn:hover{transform:translateY(-1px)}
.ibtn .badge{position:absolute;top:11px;right:12px;width:9px;height:9px;border-radius:50%;background:#E5533B;border:2px solid #fff;animation:blink 1.6s infinite}
.me{display:flex;align-items:center;gap:10px;height:54px;padding:0 14px 0 7px;border-radius:99px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.me b{display:block;font-size:13px;line-height:1.25}.me small{display:block;font-size:12px;color:var(--muted);line-height:1.25}
.burger{display:none}
.rail{grid-column:1;grid-row:2;position:sticky;top:16px;align-self:start;height:calc(100vh - 120px);min-height:500px;display:flex;flex-direction:column;align-items:center;gap:14px;z-index:30}
.rgroup{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:99px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.rgroup.end{margin-top:auto}
.rbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted);position:relative;transition:background .2s,color .2s;text-decoration:none}
.rbtn:hover{background:var(--soft);color:var(--ink)}
.rbtn.on{background:var(--ink);color:#fff}
.rbtn.lime{background:var(--lime);color:var(--sapin)}
.rbtn .tip{position:absolute;left:52px;top:50%;transform:translate(-4px,-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:10px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:5}
.rbtn:hover .tip,.rbtn:focus-visible .tip{opacity:1;transform:translate(0,-50%)}
.main{grid-column:2;grid-row:2;min-width:0}
.tabs{display:flex;gap:2px;background:#fff;border:1px solid var(--line);padding:4px;border-radius:99px;overflow-x:auto;scrollbar-width:none;min-width:0;box-shadow:var(--shadow)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:34px;padding:0 14px;border-radius:99px;font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center;transition:background .2s,color .2s}
.tabs button:hover{color:var(--ink);background:var(--soft)}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button em{font-style:normal;font-size:12px;opacity:.7}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--muted);min-width:0}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0}
.content{padding-bottom:24px;animation:enter .45s cubic-bezier(.2,.8,.2,1)}
/* Accueil sur un écran : la page tient dans la fenêtre, chaque bloc défile à l'intérieur */
.fit{height:max(690px,calc(100vh - 112px));display:flex;flex-direction:column}
.fit .ph{margin-bottom:16px}
.dash{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,.95fr) minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:minmax(0,1fr) minmax(0,1.12fr);gap:16px}
.dash>*{min-height:0}
.d-a{grid-column:1;grid-row:1}.d-b{grid-column:2;grid-row:1}.d-c{grid-column:3;grid-row:1}.d-d{grid-column:1;grid-row:2}.d-e{grid-column:2/4;grid-row:2}
.vcard{display:flex;flex-direction:column;overflow:hidden}
.scrolly{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.chartbox{flex:1;min-height:0;display:flex}
.chartbox svg{width:100%;height:100%}
.wal{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.wal .ws{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wal .w{background:#fff;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;transition:transform .2s;border:1px solid var(--line)}
.wal .w:hover{transform:translateY(-2px)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:100%}
.kgrid .kpi{padding:16px;justify-content:space-between}
.kgrid .kpi .v{font-size:32px}
.kpi.gr{background:radial-gradient(90% 90% at 20% 0%,#2E8A5E 0%,transparent 70%),linear-gradient(160deg,#18604F,#0D342D);border-color:#0F3F37;color:#fff}
.kpi.gr .t,.kpi.gr .f{color:#BFD6CD}.kpi.gr .chip-ic{background:rgba(255,255,255,.12);color:var(--lime)}.kpi.gr .up{background:rgba(166,242,107,.18);color:var(--lime)}
.acts thead th{position:sticky;top:0;z-index:1}
.acts td{padding:10px 12px}
.cbx{width:18px;height:18px;border-radius:6px;border:1.6px solid var(--line2);display:inline-grid;place-items:center;color:transparent;vertical-align:middle}
.cbx.on{background:var(--ink);border-color:var(--ink);color:#fff}
.acts tr.sel{background:var(--soft)}
.sdot{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.sdot i{width:7px;height:7px;border-radius:50%}
@keyframes enter{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.25}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(166,242,107,.75)}70%{box-shadow:0 0 0 12px rgba(166,242,107,0)}100%{box-shadow:0 0 0 0 rgba(166,242,107,0)}}
@keyframes grow{from{transform:scaleY(.05)}to{transform:none}}
@keyframes growx{from{transform:scaleX(.05)}to{transform:none}}
@keyframes draw{from{stroke-dashoffset:var(--len,1000)}to{stroke-dashoffset:0}}

/* ---------- Composants ---------- */
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:34px;font-weight:600;line-height:1.1}
.ph p{margin:6px 0 0;color:var(--muted)}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{height:42px;padding:0 18px;border-radius:99px;display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.pri{background:var(--lime);color:var(--sapin);animation:pulse 2.4s infinite}
.btn.dark{background:var(--ink);color:#fff}
.btn.sap{background:var(--sapin);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn.onlime{background:var(--sapin);color:#fff}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.card{background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);border:1px solid rgba(225,231,212,.7);min-width:0;position:relative}
.card.dk{background:var(--ink);color:#EAF2EE;border-color:var(--ink)}
.card.sp{background:linear-gradient(160deg,#155446,#0D342D);color:#E8F3EE;border-color:#0F3F37}
.card.lm{background:var(--lime);color:var(--sapin);border-color:var(--lime)}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:32px}
.ch h3{font-size:16px;font-weight:600}
.ch .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--sapin);flex:none}
.dk .chip-ic,.sp .chip-ic{background:rgba(255,255,255,.1);color:var(--lime)}
.lm .chip-ic{background:rgba(15,63,55,.12);color:var(--sapin)}
.round{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#fff;color:var(--ink);transition:transform .2s,background .2s}
.round:hover{transform:rotate(45deg)}
.dk .round,.sp .round{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.lm .round{background:rgba(255,255,255,.5);border-color:transparent}
.muted{color:var(--muted)}.dk .muted,.sp .muted{color:#A8BDB5}.lm .muted{color:#2E5A44}
.meta{font-size:12px;color:var(--muted)}
.dk .meta,.sp .meta{color:#A8BDB5}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live .d{animation:blink 1.4s infinite}
.p-ok{background:var(--s5);color:var(--s5f)}.p-warn{background:var(--s4);color:var(--s4f)}.p-n{background:var(--soft);color:var(--muted);border:1px solid var(--line)}.p-al{background:var(--alert);color:var(--alertf)}
.p-1{background:var(--s1);color:var(--s1f)}.p-2{background:var(--s2);color:var(--s2f)}.p-3{background:var(--s3);color:var(--s3f)}.p-4{background:var(--s4);color:var(--s4f)}.p-5{background:var(--s5);color:var(--s5f)}
.p-dk{background:rgba(255,255,255,.1);color:#fff}
.delta{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
.up{background:var(--s5);color:var(--s5f)}.down{background:var(--s5);color:var(--s5f)}.bad{background:var(--alert);color:var(--alertf)}.flat{background:var(--soft);color:var(--muted)}
.dk .up,.sp .up{background:rgba(166,242,107,.16);color:var(--lime)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-display);flex:none;color:var(--sapin);border:2px solid #fff}
.av.l{width:64px;height:64px;font-size:22px}.av.xs{width:28px;height:28px;font-size:11px}
.avs{display:flex}.avs .av{margin-left:-6px}.avs .av:first-child{margin-left:0}
.a1{background:#CDE8FF}.a2{background:#E4DAFF}.a3{background:#FFDDBF}.a4{background:#FFF0A8}.a5{background:#CFF3BE}.a6{background:#FFD6E2}.a7{background:#C9F0EA}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.tr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--sapin);transform-origin:left;animation:growx .9s cubic-bezier(.2,.8,.2,1)}
.dk .bar,.sp .bar{background:rgba(255,255,255,.08);border-color:transparent}
.hatch{background-image:repeating-linear-gradient(135deg,rgba(15,63,55,.18) 0 2px,transparent 2px 7px)}
.divider{height:1px;background:var(--line);margin:12px 0}
.kpi{padding:18px;border-radius:var(--r-lg);background:var(--card);border:1px solid rgba(225,231,212,.7);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .2s}
.kpi:hover{transform:translateY(-2px)}
.kpi .t{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.kpi .t .chip-ic{margin-left:auto;width:30px;height:30px}
.kpi .v{font-size:34px;font-weight:600;line-height:1.1}
.kpi .f{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--muted)}
.kpi.lm{background:var(--lime);border-color:var(--lime);color:var(--sapin)}
.kpi.lm .t,.kpi.lm .f{color:#2E5A44}
.kpi.lm .up{background:rgba(255,255,255,.55);color:var(--sapin)}
svg text{font-family:var(--f-body)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gb{transform-box:fill-box;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.chart .ln{stroke-dasharray:var(--len,1200);animation:draw 1.4s ease-out both}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.dk .legend,.sp .legend{color:#A8BDB5}
.seg{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);padding:3px;border-radius:99px}
.seg button{padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dk .seg{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.dk .seg button{color:#A8BDB5}.dk .seg button.on{background:var(--lime);color:var(--sapin)}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;background:var(--soft);white-space:nowrap}
.tbl th:first-child{border-radius:12px 0 0 12px}.tbl th:last-child{border-radius:0 12px 12px 0}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s;cursor:pointer}
.tbl tbody tr:hover{background:var(--soft)}
.scrollx{overflow-x:auto}
.toggle{width:46px;height:26px;border-radius:99px;background:var(--line2);position:relative;transition:background .25s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s}
.toggle.on{background:var(--sapin)}
.toggle.on::after{transform:translateX(20px);background:var(--lime)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--ink);transition:background .2s}
.chip:hover{background:var(--soft)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--sapin)}
.dk .tag,.sp .tag{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:#DDEBE5}
.empty-slot{border:1.5px dashed var(--line2);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-weight:500;min-height:44px;transition:background .2s,border-color .2s}
.empty-slot:hover{background:var(--limebg);border-color:var(--feuille);color:var(--sapin)}
.why{margin-top:10px;border-radius:14px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.why summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:600;display:flex;align-items:center;gap:8px}
.why summary::-webkit-details-marker{display:none}
.why[open] summary .ico{transform:rotate(90deg)}
.why ul{margin:0;padding:0 12px 12px 12px;list-style:none;display:flex;flex-direction:column;gap:6px}
.why li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.plus{color:var(--s5f);font-weight:700}.minus{color:var(--s3f);font-weight:700}

/* Accueil */
.hello{display:flex;align-items:center;gap:18px}
.hello img{width:64px;height:auto;margin-bottom:-6px}
.cd{font-family:var(--f-display);font-size:44px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.task{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);transition:background .2s,opacity .3s}
.task:hover{background:var(--soft)}
.task .box{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent;transition:all .2s}
.task.done{opacity:.55}.task.done .tt{text-decoration:line-through}
.task.done .box{background:var(--sapin);border-color:var(--sapin);color:var(--lime)}
.stg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stg .s{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;position:relative;transition:transform .2s}
.stg .s:hover{transform:translateY(-2px)}
.stg .s b{font:600 24px var(--f-display)}
.stg .s small{font-size:12px;font-weight:600}
.conv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
.conv span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.offer{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s;min-width:0}
.offer:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.offer h4{margin:0;font:600 16px/1.3 var(--f-display)}
.feed{display:flex;flex-direction:column;gap:2px}
.feed .it{display:flex;gap:12px;padding:10px 0;align-items:flex-start;border-bottom:1px dashed rgba(255,255,255,.12)}
.feed .it:last-child{border-bottom:0}
.feed .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:rgba(166,242,107,.14);color:var(--lime);flex:none}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kanban{height:max(440px,calc(100vh - 300px))}
.col{overflow-y:auto;scrollbar-width:thin;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0;transition:background .2s,border-color .2s}
.col.over{background:var(--limebg);border-color:var(--feuille)}
.colh{position:sticky;top:-10px;z-index:2;background:inherit;backdrop-filter:blur(8px);margin:-10px -10px 0;padding:14px 16px 8px!important;border-radius:20px 20px 0 0;display:flex;align-items:center;gap:8px;padding:6px 6px 8px}
.colh b{font-family:var(--f-display);font-size:14px}
.colh .n{margin-left:auto;font:600 13px var(--f-display);background:#fff;border-radius:99px;padding:1px 9px;border:1px solid var(--line)}
.kc{background:#fff;border-radius:16px;padding:12px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,63,55,.05);cursor:grab;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .2s}
.kc:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.kc.drag{opacity:.4}
.kc .nx{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.kc:hover .nx{opacity:1}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring b{position:absolute;font:600 12px var(--f-display)}
.cls{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.cls i{width:8px;height:8px;border-radius:50%}

/* Agenda */
.week{display:grid;grid-template-columns:56px repeat(5,minmax(0,1fr));border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#fff}
.week .hd{padding:10px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;background:var(--soft)}
.week .hd.today{background:var(--ink);color:#fff}
.week .hd small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.week .hd.today small{color:var(--lime)}
.week .hr{font-size:12px;color:var(--faint);padding:4px 8px;border-right:1px solid var(--line);height:56px}
.week .cell{border-left:1px solid var(--line);border-top:1px solid var(--line);height:56px;position:relative}
.ev{position:absolute;left:4px;right:4px;border-radius:12px;padding:6px 8px;font-size:12px;overflow:hidden;z-index:2;cursor:pointer;transition:transform .15s}
.wev:hover{transform:scale(1.02)}
.ev b{display:block;font-size:12px}
.free{position:absolute;inset:4px;border:1.5px dashed var(--feuille);border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--sapin);background:var(--limebg);opacity:.0;transition:opacity .2s}
.free{opacity:.0}.free.show{opacity:.55}.cell:hover .free{opacity:1}
.now{position:absolute;left:0;right:0;height:2px;background:#E5533B;z-index:3}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#E5533B}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.dots .w{font-size:11px;font-weight:600;opacity:.7}
.dots .d{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f-display);border:1.5px dashed rgba(15,63,55,.35);cursor:pointer;transition:transform .15s}
.dots .d:hover{transform:scale(1.1)}
.dots .d.f{border:0;background:rgba(255,255,255,.6)}
.dots .d.b{border:0;background:var(--sapin);color:#fff}
.dots .d.t{border:0;background:var(--ink);color:var(--lime);box-shadow:0 0 0 3px #fff}
.dots .d.x{border:0;opacity:.25}

/* Messages */
.msg{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;gap:16px;height:calc(100vh - 210px);min-height:520px}
.cl{display:flex;flex-direction:column;gap:4px;overflow:auto}
.cv{display:flex;gap:10px;padding:10px;border-radius:16px;cursor:pointer;transition:background .2s;align-items:center}
.cv:hover{background:var(--soft)}
.cv.on{background:var(--ink);color:#fff}
.cv.on .meta{color:#A8BDB5}
.cv .un{width:20px;height:20px;border-radius:50%;background:var(--lime);color:var(--sapin);font-size:11px;font-weight:700;display:grid;place-items:center}
.thread{display:flex;flex-direction:column;padding:0;overflow:hidden}
.thh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.bubbles{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(var(--soft),#fff)}
.bb{max-width:72%;padding:10px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:14px;animation:enter .3s}
.bb.me{align-self:flex-end;background:var(--sapin);color:#fff;border-color:var(--sapin);border-bottom-right-radius:6px}
.bb.them{border-bottom-left-radius:6px}
.bb .tm{display:block;font-size:11px;opacity:.65;margin-top:4px;text-align:right}
.wave{display:flex;align-items:center;gap:2px;height:26px}
.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.75}
.composer{display:flex;gap:8px;align-items:center;padding:12px;border-top:1px solid var(--line)}
.composer input{flex:1;height:44px;border-radius:99px;border:1px solid var(--line);padding:0 16px;background:var(--soft)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 4px}
.sugg button{font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--limebg);color:var(--sapin);border:1px solid var(--lime2)}

/* Flux suivi */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 2px 8px}
.fnode{min-width:150px;flex:1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative}
.fnode.dkn{background:var(--ink);color:#fff;border-color:var(--ink)}
.flink{flex:none;width:34px;display:grid;place-items:center;color:var(--feuille)}
.flink svg{width:34px}

/* Connexion */
.login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--page);padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.lframe{width:min(1180px,100%);min-height:min(720px,calc(100vh - 32px));border-radius:36px;background:var(--ink);padding:14px;display:grid;grid-template-columns:1.15fr 1fr;gap:14px;box-shadow:var(--shadow-float)}
.lart{border-radius:26px;background:radial-gradient(80% 70% at 30% 30%,#2B7A68 0%,transparent 70%),linear-gradient(160deg,#1A5B4F,#0C302A);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:32px;color:#fff}
.lart .floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#0E3A32,#0A2B25)}
.lart .hero{position:absolute;left:10%;bottom:7%;height:56%;z-index:2}
.lart .orb{position:absolute;right:12%;top:30%;width:130px;z-index:2;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.fcard{position:absolute;z-index:3;background:rgba(255,255,255,.92);color:var(--ink);border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25);font-size:13px;animation:float 6s ease-in-out infinite}
.fcard b{display:block;font-size:13px}
.lform{border-radius:26px;background:#fff;padding:40px clamp(20px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:14px}
.lform h1{font-size:38px;font-weight:600;line-height:1.1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input{height:50px;border-radius:99px;border:1px solid var(--line2);padding:0 20px;background:var(--soft);transition:border-color .2s,box-shadow .2s}
.field input:focus{outline:0;border-color:var(--sapin);box-shadow:0 0 0 4px rgba(166,242,107,.45)}
.sso{display:flex;gap:10px;justify-content:center}
.sso button{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);display:grid;place-items:center;font:700 15px var(--f-display);background:#fff;transition:transform .15s}
.sso button:hover{transform:translateY(-2px)}

/* Superpositions */
.overlay{position:fixed;inset:0;background:rgba(14,27,23,.35);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.palette{width:min(620px,100%);background:#fff;border-radius:24px;box-shadow:var(--shadow-float);overflow:hidden}
.palette input{width:100%;height:60px;border:0;border-bottom:1px solid var(--line);padding:0 20px 0 52px;font-size:16px;outline:0}
.palette .pl{max-height:50vh;overflow:auto;padding:8px}
.palette .po{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;cursor:pointer}
.palette .po.on,.palette .po:hover{background:var(--soft)}
.drop{position:absolute;top:58px;right:0;width:360px;max-width:calc(100vw - 32px);background:#fff;border-radius:22px;box-shadow:var(--shadow-float);padding:12px;z-index:40;animation:enter .25s;border:1px solid var(--line)}
.drawer{position:fixed;top:16px;bottom:16px;right:max(16px,env(safe-area-inset-right,0px));width:min(400px,calc(100vw - 32px));background:#fff;border-radius:28px;box-shadow:var(--shadow-float);z-index:90;display:flex;flex-direction:column;overflow:hidden;animation:slidein .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(110%)}}
.orbifab{position:fixed;right:max(24px,calc(env(safe-area-inset-right,0px) + 24px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:var(--ink);display:grid;place-items:center;z-index:50;box-shadow:var(--shadow-float);animation:pulse 2.6s infinite}
.orbifab img{width:52px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;z-index:120;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-float);animation:toast .35s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 32px);font-weight:500}
.toast .ico{color:var(--lime)}
@keyframes toast{from{transform:translate(-50%,30px);opacity:0}}

/* ---------- Version compacte (retour du 12/11, 17 h 45) ---------- */
.app{grid-template-columns:46px minmax(0,1fr);gap:14px 18px;padding-block:12px}
.logo{height:44px;padding:0 14px 0 12px;gap:8px}.logo svg{width:16px;height:22px}.logo b{font-size:16px}.logo i{font-size:10px;padding:1px 7px}
.topnav{padding:4px}.topnav a{height:34px;padding:0 14px;font-size:13px;gap:6px}.topnav a .ico{width:14px;height:14px}
.topnav .cnt{min-width:16px;height:16px;font-size:10px}
.ibtn{width:40px;height:40px}.ibtn .ico{width:16px;height:16px}.ibtn .badge{top:9px;right:10px;width:8px;height:8px}
.me{height:44px;padding:0 12px 0 5px;gap:8px}.me b{font-size:12.5px}.me small{font-size:11.5px}
.rail{top:12px;height:calc(100vh - 92px);gap:10px}
.rgroup{padding:4px;gap:4px}.rbtn{width:36px;height:36px}.rbtn .ico{width:16px;height:16px}.rbtn .tip{left:46px}
.ph{margin-bottom:14px;gap:12px}.ph h1{font-size:26px}.ph p{margin-top:2px;font-size:13px}
.tabs{padding:3px}.tabs button{height:28px;padding:0 12px;font-size:12.5px}
.btn{height:36px;padding:0 15px;font-size:13px;gap:7px}.btn .ico{width:15px;height:15px}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.btn.pri{background:var(--lime);color:var(--sapin);box-shadow:none;animation:none}.btn.pri:hover{background:#97E85A}

@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.fit{height:max(560px,calc(100vh - 86px))}
.fit .ph{margin-bottom:12px}
.dash{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.25fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:14px}
.d-a{grid-column:1;grid-row:1}.d-b{grid-column:2;grid-row:1}.d-c{grid-column:3;grid-row:1}.d-d{grid-column:1;grid-row:2}.d-t{grid-column:2;grid-row:2}.d-n{grid-column:3;grid-row:2}
.dash .card{padding:16px 18px;border-radius:20px}
.dash .ch{margin-bottom:10px;min-height:28px}.dash .ch h3{font-size:14.5px}
.dash .round{width:30px;height:30px}
.kgrid{gap:10px}
.kgrid .kpi{padding:12px 14px;gap:2px;border-radius:18px}
.kgrid .kpi .t{font-size:12.5px}.kgrid .kpi .t .chip-ic{width:26px;height:26px;border-radius:9px}
.kgrid .kpi .v{font-size:24px}
.kgrid .kpi .f{font-size:11.5px}
/* défilement léger : pas de barre, fondu + indicateur */
.sc{position:relative;flex:1;min-height:0;display:flex}
.sc-in{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-right:10px;-webkit-mask-image:linear-gradient(#000 calc(100% - 46px),transparent);mask-image:linear-gradient(#000 calc(100% - 46px),transparent);transition:mask-image .2s}
.sc-in::-webkit-scrollbar{display:none}
.sc.mid .sc-in{-webkit-mask-image:linear-gradient(transparent,#000 30px,#000 calc(100% - 46px),transparent);mask-image:linear-gradient(transparent,#000 30px,#000 calc(100% - 46px),transparent)}
.sc.end .sc-in{-webkit-mask-image:linear-gradient(transparent,#000 30px);mask-image:linear-gradient(transparent,#000 30px)}
.sc.none .sc-in{-webkit-mask-image:none;mask-image:none}
.sc-rail{position:absolute;right:0;top:4px;bottom:4px;width:3px;border-radius:9px;background:var(--line)}
.sc-thumb{position:absolute;left:0;width:3px;border-radius:9px;background:var(--sapin);transition:top .1s}
.sc.none .sc-rail{display:none}
.sc-more{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);height:26px;padding:0 10px 0 8px;border-radius:99px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px;box-shadow:0 6px 16px rgba(14,27,23,.25);transition:opacity .2s,transform .2s}
.sc-more .ico{width:13px;height:13px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(2px)}}
.sc.end .sc-more,.sc.none .sc-more{opacity:0;pointer-events:none;transform:translate(-50%,6px)}
.dk .sc-rail{background:rgba(255,255,255,.12)}.dk .sc-thumb{background:var(--lime)}
/* carrousel horizontal */
.hc{position:relative;min-width:0}
.hc-in{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.hc-in::-webkit-scrollbar{display:none}
.hc.mid .hc-in{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 85%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 85%,transparent)}
.hc.end .hc-in{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%);mask-image:linear-gradient(90deg,transparent,#000 12%)}
.hc-in>*{scroll-snap-align:start;flex:0 0 calc(50% - 4px)}
.hc-nav{display:flex;align-items:center;gap:6px}
.hc-nav button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;transition:opacity .2s}
.hc-nav button:disabled{opacity:.35;cursor:default}
.hc-dots{display:flex;gap:4px;justify-content:center;margin-top:8px}
.hc-dots i{width:6px;height:6px;border-radius:99px;background:var(--line2);transition:width .25s,background .25s}
.hc-dots i.on{width:18px;background:var(--sapin)}
.oc{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:transform .2s;min-width:0}
.oc:hover{transform:translateY(-2px)}
/* graphique interactif */
.ibar{cursor:pointer}
.ibar .hit{fill:transparent}
.ibar:hover .hl,.ibar.on .hl{fill:rgba(15,63,55,.06)}
.ctip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:8px 10px;font-size:12px;box-shadow:0 10px 24px rgba(14,27,23,.25);transform:translate(-50%,-100%);white-space:nowrap;z-index:5;transition:left .15s,top .15s,opacity .15s}
.ctip b{font-family:var(--f-display)}
.ctip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.nt{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;text-decoration:none;transition:background .2s}
.nt:hover{background:var(--soft)}
.nt .ti{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.nt .ud{width:8px;height:8px;border-radius:50%;background:var(--feuille);flex:none;margin-top:6px;animation:blink 1.6s infinite}

.sparkf{position:relative;flex:1;min-height:0;margin:6px -4px 0}.sparkf svg{position:absolute;inset:0;width:100%;height:100%}.sp-l{position:absolute;right:4px;top:0;font-size:11px}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:drw 1.4s .2s ease forwards}@keyframes drw{to{stroke-dashoffset:0}}
.ptl{flex:1;min-height:60px}.cv{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.06);text-decoration:none;transition:background .2s}.cv:hover{background:rgba(255,255,255,.12)}
.sc-b{font-family:var(--f-display);font-size:12px;color:var(--lime)}
.sparkf{min-height:30px}@media (max-height:800px){.sp-l{display:none}.d-d .tprog{display:none}}
.nlist{flex:1;justify-content:space-evenly;gap:2px}
.gb{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){.gb,.draw{animation:none;stroke-dashoffset:0}}

.lnk{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink);text-decoration:none;transition:background .2s}.lnk:hover{background:var(--soft)}.lnk .ico{width:13px;height:13px}
.ofr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;border:1px solid var(--line);text-decoration:none;color:inherit;transition:border-color .2s,transform .2s}.ofr:hover{border-color:var(--sapin);transform:translateX(2px)}
.ofr b.tr{display:block;font-size:13px}.ofr .meta{display:block}.ofr .bar{display:block}
.ot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--sapin)}
.ofr .on{display:flex;flex-direction:column;align-items:flex-end;flex:none}.ofr .on .num{font-size:18px;line-height:1}
.nx{background:linear-gradient(180deg,#F4F0FF 0%,#fff 42%)}
.nx-ic{width:36px;height:36px;border-radius:12px;background:var(--s2);color:var(--s2f);display:grid;place-items:center;flex:none;margin-right:10px}
.nx .cv{background:#fff;border:1px solid var(--line);color:inherit;padding:7px 10px}.nx .cv:hover{background:#fff;border-color:var(--s2f)}
.nx .sc-b{font-family:var(--f-display);font-size:12px;color:var(--s5f)}
.nx-t{font-size:15px;line-height:1.35;margin:12px 0 2px}.ptl{min-height:0}@media (max-height:800px){.nx-s{display:none}.nx-t{margin:10px 0 0}}
.app{row-gap:24px}.fit{height:max(560px,calc(100vh - 100px))}.fit .ph{margin-bottom:22px}.dash{gap:16px}

html{scrollbar-width:none}html::-webkit-scrollbar{display:none}
.scrolly,.col{scrollbar-width:thin;scrollbar-color:rgba(15,63,55,.35) transparent}
.scrolly::-webkit-scrollbar,.col::-webkit-scrollbar{width:4px}.scrolly::-webkit-scrollbar-thumb,.col::-webkit-scrollbar-thumb{background:rgba(15,63,55,.35);border-radius:9px}.scrolly::-webkit-scrollbar-track,.col::-webkit-scrollbar-track{background:transparent}

function cdStart(){clearInterval(cdT);const tick=()=>{const el=document.getElementById('cd');if(!el)return clearInterval(cdT);const s=Math.max(0,Math.round((cdEnd-Date.now())/1000));el.textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')};tick();cdT=setInterval(tick,1000)}
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.innerHTML=I('check')+t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function advance(id){const c=C[id],i=STAGES.findIndex(x=>x.k===c.st);if(i>=4)return;c.st=STAGES[i+1].k;toast(`${c.n} passe à l'étape ${STAGES[i+1].l}`);render(true)}
function kanban(){let dragId=null;document.querySelectorAll('.kc').forEach(k=>{k.addEventListener('dragstart',e=>{dragId=+k.dataset.id;k.classList.add('drag');e.dataTransfer.effectAllowed='move'});k.addEventListener('dragend',()=>k.classList.remove('drag'))});
 document.querySelectorAll('.col').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});col.addEventListener('dragleave',()=>col.classList.remove('over'));col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');if(dragId==null)return;const c=C[dragId];if(c.st!==col.dataset.col){c.st=col.dataset.col;toast(`${c.n} déplacé·e vers ${STAGES.find(s=>s.k===c.st).l}`);render(true)}})})}
function lcHover(){document.querySelectorAll('.lc .hover').forEach(r=>{const svg=r.ownerSVGElement,pts=JSON.parse(r.dataset.pts),vals=JSON.parse(r.dataset.v),u=r.dataset.u,b=+r.dataset.b,tip=svg.querySelector('.tip');
 r.addEventListener('mousemove',e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());let bi=0;pts.forEach((q,i)=>{if(Math.abs(q[0]-p.x)<Math.abs(pts[bi][0]-p.x))bi=i});const [x,y]=pts[bi];
  tip.innerHTML=`<line x1="${x}" x2="${x}" y1="${y}" y2="${b}" stroke="#0E1B17" stroke-dasharray="3 3" opacity=".4"/><rect x="${x-44}" y="${y-40}" width="88" height="26" rx="13" fill="#0E1B17"/><text x="${x}" y="${y-23}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${vals[bi]} ${u}</text><circle cx="${x}" cy="${y}" r="6" fill="#A6F26B" stroke="#0E1B17" stroke-width="2.5"/>`})})}
function closeLayer(){document.getElementById('layer').innerHTML='';document.querySelectorAll('.drop').forEach(d=>d.remove())}
function palette(){const items=[...NAV.flatMap(([,it])=>it.map(([k,l,ic])=>({l,ic,go:k,s:'Page'}))),...C.map(c=>({l:c.n,ic:'users',cand:c.id,s:c.role})),...OFFERS.filter(o=>o.st!=='draft').map(o=>({l:o.t,ic:'offres',go:'offre',s:'Offre'})),{l:'Écran de connexion',ic:'out',go:'connexion',s:'Page'}];
 document.getElementById('layer').innerHTML=`<div class="overlay" id="ov"><div class="palette" role="dialog" aria-label="Recherche"><div style="position:relative"><span style="position:absolute;left:18px;top:20px;color:var(--muted)">${I('search')}</span><input id="pin" placeholder="Une page, un candidat, une offre…" autocomplete="off"></div><div class="pl" id="pl"></div></div></div>`;
 let sel=0;const draw=()=>{const q=document.getElementById('pin').value.toLowerCase();const f=items.filter(i=>i.l.toLowerCase().includes(q)).slice(0,9);sel=Math.min(sel,f.length-1);document.getElementById('pl').innerHTML=f.map((i,n)=>`<div class="po ${n===sel?'on':''}" data-i="${items.indexOf(i)}"><span class="chip-ic">${I(i.ic,'s')}</span><div><b>${i.l}</b><div class="meta">${i.s}</div></div><span style="margin-left:auto">${I('chev','s')}</span></div>`).join('')||'<div class="meta" style="padding:14px">Aucun résultat</div>';return f};
 const pick=i=>{closeLayer();if(i.cand!=null){S.cand=i.cand;location.hash='candidat';if(S.view==='candidat')render()}else location.hash=i.go};
 const inp=document.getElementById('pin');inp.focus();let cur=draw();inp.addEventListener('input',()=>{sel=0;cur=draw()});inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,cur.length-1);cur=draw();e.preventDefault()}if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);cur=draw();e.preventDefault()}if(e.key==='Enter'&&cur[sel])pick(cur[sel])});
 document.getElementById('pl').addEventListener('click',e=>{const p=e.target.closest('.po');if(p)pick(items[+p.dataset.i])});document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeLayer()})}
function bell(btn){const w=btn.parentElement;if(w.querySelector('.drop'))return closeLayer();closeLayer();w.insertAdjacentHTML('beforeend',`<div class="drop" role="dialog" aria-label="Notifications"><div class="row" style="padding:6px 8px 10px"><b style="font-family:var(--f-display);font-size:16px">Notifications</b><span class="pill p-ok" style="margin-left:auto">4 nouvelles</span></div>${[['users','6 nouvelles candidatures classées','Analyste de données · 20 min','candidats'],['cal','Sarah a réservé vendredi 11 h','Créneau confirmé · 1 h','agenda'],['tests','Junior a commencé son test','Il y a 2 h','tests'],['chat','Grace vous a écrit','10:42','messages']].map(n=>`<a href="#${n[3]}" class="row" style="padding:10px 8px;border-radius:14px;text-decoration:none"><span class="chip-ic">${I(n[0],'s')}</span><div style="min-width:0"><b style="font-size:13px;display:block">${n[1]}</b><span class="meta">${n[2]}</span></div><i style="width:8px;height:8px;border-radius:50%;background:var(--feuille);margin-left:auto;flex:none"></i></a>`).join('')}</div>`)}
function meMenu(btn){const w=btn.parentElement;if(w.querySelector('.drop'))return closeLayer();closeLayer();w.insertAdjacentHTML('beforeend',`<div class="drop" style="width:260px"><div class="row" style="padding:8px">${av('Nadia Kalala','a3')}<div><b>Nadia Kalala</b><div class="meta">Recruteuse · Baobab Fintech</div></div></div><div class="divider"></div>${[['team','Équipe','equipe'],['card','Formule','formule'],['out','Se déconnecter','connexion']].map(m=>`<a href="#${m[2]}" class="row" style="padding:10px;border-radius:12px;text-decoration:none">${I(m[0])}${m[1]}</a>`).join('')}</div>`)}
function orbi(){document.getElementById('layer').innerHTML=`<div class="overlay" id="ov" style="padding:0;background:rgba(14,27,23,.2)"></div><aside class="drawer" role="dialog" aria-label="Orbi"><div class="row" style="padding:18px;background:var(--ink);color:#fff"><img src="${IMG.orbi}" alt="" style="width:48px"><div><b style="font-family:var(--f-display);font-size:18px">Orbi</b><div class="meta" style="color:#A8BDB5">Votre assistant de recrutement</div></div><button class="round" id="ox" style="margin-left:auto" aria-label="Fermer">${I('x','s')}</button></div>
 <div class="stack" id="ob" style="flex:1;overflow:auto;padding:16px;gap:10px;background:var(--soft)"><div class="bb them">Bonjour Nadia. Voici ce qui demande votre attention aujourd'hui.</div>${[['users','6 candidats prêts pour la short-list','candidats'],['chat','Grace attend une réponse','messages'],['cal','4 candidats sans créneau','agenda']].map(s=>`<a href="#${s[2]}" class="row" style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-decoration:none"><span class="chip-ic" style="background:var(--limebg)">${I(s[0],'s')}</span><b style="flex:1;font-size:13px">${s[1]}</b>${I('chev','s')}</a>`).join('')}</div>
 <div class="sugg" style="padding-top:10px">${['Résume la candidature de Grace','Compare Grace et Junior','Rédige une relance'].map(s=>`<button data-ask="${s}">${s}</button>`).join('')}</div><form class="composer" id="of"><input id="oin" placeholder="Demander à Orbi…" autocomplete="off"><button class="btn sap sm" type="submit">${I('send','s')}</button></form><div class="meta" style="padding:0 16px 14px">Orbi propose, vous décidez.</div></aside>`;
 const ask=q=>{const b=document.getElementById('ob');b.insertAdjacentHTML('beforeend',`<div class="bb me">${q}</div>`);setTimeout(()=>{b.insertAdjacentHTML('beforeend',`<div class="bb them">${q.includes('Compare')?'Grace est plus forte en SQL et Power BI (92 et 88). Junior la dépasse en Python (90 contre 48). Pour ce poste centré sur le reporting, Grace correspond mieux.':q.includes('relance')?'« Bonjour, votre test SQL et Power BI vous attend encore. Il prend 30 minutes. » Voulez-vous l\'envoyer à Junior ?':'Grace, 3 ans d\'analyse en banque, 4 compétences sur 5, test à 88 sur 100. Point à vérifier : Python débutant.'}</div>`);b.scrollTop=b.scrollHeight},500);b.scrollTop=b.scrollHeight};
 document.getElementById('ox').onclick=closeLayer;document.getElementById('ov').onclick=closeLayer;document.querySelectorAll('[data-ask]').forEach(x=>x.onclick=()=>ask(x.dataset.ask));document.getElementById('of').onsubmit=e=>{e.preventDefault();const v=document.getElementById('oin').value.trim();if(v){ask(v);document.getElementById('oin').value=''}}}
function showLogin(){if(document.getElementById('login'))return;document.body.insertAdjacentHTML('beforeend',`<div class="login" id="login"><div class="lframe"><div class="lart"><div class="row" style="gap:10px;z-index:3">${SYM.replace('<svg','<svg style="width:22px;height:30px"')}<b style="font-family:var(--f-display);font-size:22px">jumanly</b><span class="pill" style="background:var(--lime);color:var(--sapin)">Hire</span></div><h2 style="font-size:clamp(24px,3vw,36px);max-width:420px;margin-top:22px;z-index:3;color:#fff">Recrutez les bons talents, plus vite.</h2><div class="floor"></div><img class="hero" src="${IMG.nadia}" alt=""><img class="orb" src="${IMG.orbi}" alt="">
 <div class="fcard" style="right:8%;top:46%"><span class="chip-ic" style="background:var(--lime)">${I('users','s')}</span><div><b>12 candidatures triées</b><span class="meta">par Orbi, avec le pourquoi</span></div></div><div class="fcard" style="right:20%;bottom:12%;animation-delay:-2s"><span class="chip-ic" style="background:var(--s3)">${I('cal','s')}</span><div><b>Entretien réservé</b><span class="meta">Vendredi 11 h</span></div></div></div>
 <form class="lform" id="lf"><div class="row" style="gap:8px">${SYM.replace('<svg','<svg style="width:18px;height:24px"').replace('#fff','#0F3F37')}<b style="font-family:var(--f-display);font-size:18px">jumanly</b></div><h1>Bon retour</h1><p class="muted" style="margin:-6px 0 6px">Connectez-vous à votre espace recruteur.</p>
 <div class="field"><label for="le">E-mail professionnel</label><input id="le" type="email" value="nadia@baobab-fintech.cd"></div><div class="field"><label for="lp">Mot de passe</label><input id="lp" type="password" value="motdepasse"></div><a href="#connexion" class="meta" style="align-self:flex-end">Mot de passe oublié ?</a>
 <button class="btn pri" style="justify-content:center;height:52px" type="submit">Se connecter ${I('right')}</button><div class="row meta" style="justify-content:center">ou avec</div><div class="sso"><button type="button" aria-label="Google">G</button><button type="button" aria-label="Microsoft">M</button><button type="button" aria-label="LinkedIn">in</button></div><p class="meta" style="text-align:center;margin:8px 0 0">Pas encore de compte ? <a href="#connexion"><b>Créer l'espace de mon entreprise</b></a></p></form></div></div>`);
 document.getElementById('lf').onsubmit=e=>{e.preventDefault();location.hash='accueil'}}
function hideLogin(){const l=document.getElementById('login');l&&l.remove()}

document.addEventListener('click',e=>{const t=e.target.closest('button,[data-go],[data-offer],[data-cand],a,[data-conv]');if(!t)return;
 if(!t.closest('.drop')&&!t.closest('#bell')&&!t.closest('#mebtn'))document.querySelectorAll('.drop').forEach(d=>d.remove());
 const d=t.dataset;
 if(d.next!=null){e.stopPropagation();advance(+d.next);return}
 if(d.sel!=null){S.sel[+d.sel]=!S.sel[+d.sel];render(true);return}
 if(d.agev!=null){agEv(+d.agev);return}
 if(d.agslot){const [x,y]=d.agslot.split(':');agSlot(+x,+y);return}
 if(d.qa!=null){S.qa=S.qa||{};S.qa[d.qa]=!S.qa[d.qa];render(true);return}
 if(d.act==='prevc'||d.act==='nextc'){S.cand=(S.cand+(d.act==='nextc'?1:C.length-1))%C.length;render();return}
 if(d.cf){S.cf=d.cf;render(true);return}
 if(d.vcv){const [k,v]=d.vcv.split(':');S.vc=S.vc||{};const a=S.vc[k]=S.vc[k]||[];const j=a.indexOf(v);j<0?a.push(v):a.splice(j,1);if(t.closest('.vh-r')){const tb=document.querySelector(`[data-vct="${k}"]`);if(tb){document.querySelectorAll('.vct').forEach(b=>b.classList.toggle('on',b===tb));document.querySelectorAll('.vcp').forEach(p=>p.classList.toggle('on',p.dataset.vcp===k))}}vApply();return}
 if(d.vct){document.querySelectorAll('.vct').forEach(b=>b.classList.toggle('on',b===t));document.querySelectorAll('.vcp').forEach(p=>p.classList.toggle('on',p.dataset.vcp===d.vct));return}
 if(d.vclr!=null){S.vc={};S.vs='';const i=document.getElementById('vsq');if(i)i.value='';vApply();return}
 if(d.vfav!=null){const i=+d.vfav;S.vfav[i]=!S.vfav[i];toast(S.vfav[i]?'Ajouté aux favoris':'Retiré des favoris');render(true);return}
 if(d.act==='swoffer'){toast('Choix de l\'offre : Analyste de données, Chargé·e de clientèle, Développeur·se mobile…');return}
 if(d.stat){S.smp=null;statModal(d.stat);return}
 if(d.rk){rModal(d.rk);return}
 if(d.sp){if(d.sp==='c')S.spc=1;else{S.spc=0;S.sp=+d.sp}render(true);return}
 if(d.act==='allnotif'){bell(document.getElementById('bell'));return}
 if(d.task!=null){S.tasks[+d.task]^=1;render(true);toast(S.tasks[+d.task]?'Tâche terminée':'Tâche rouverte');return}
 if(d.tab){S.tab[S.view]=d.tab;render();return}
 if(d.rule!=null){S.rules[+d.rule]^=1;render(true);toast(S.rules[+d.rule]?'Règle activée':'Règle mise en pause');return}
 if(d.conv!=null){S.conv=+d.conv;CONVS[S.conv].u=0;render(true);return}
 if(d.sugg){sendMsg(d.sugg);return}
 if(d.cand!=null&&!t.classList.contains('kc')||d.cand!=null&&t.classList.contains('kc')){S.cand=+d.cand;S.tab.candidat='Résumé';location.hash==='#candidat'?render():location.hash='candidat';return}
 if(d.offer){location.hash='offre';return}
 if(d.go){if(location.hash==='#'+d.go)render();else location.hash=d.go;return}
 if(d.toast){toast(d.toast);return}
 if(d.copy){const done=()=>toast('Lien copié');navigator.clipboard&&navigator.clipboard.writeText(d.copy).then(done,done);return}
 if(d.chip!=null){t.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));t.classList.add('on');return}
 if(d.fav!=null){const on=t.style.background;t.style.background=on?'':'var(--lime)';t.style.borderColor=on?'':'var(--lime)';toast(on?'Retiré des favoris':'Ajouté aux favoris');return}
 if(d.act==='publish'){toast('Orbi prépare l\'annonce : titre, missions, compétences');return}
 if(d.act==='join'){toast('Ouverture de Google Meet avec Grace Mbuyi');return}
 if(d.act&&d.act.startsWith('tab:')){S.tab[S.view]=d.act.slice(4);render();return}
 if(t.id==='collapse'){document.getElementById('app').classList.toggle('mini');return}
 if(t.id==='burger'){document.getElementById('app').classList.toggle('open');return}
 if(t.id==='searchbtn'){palette();return}
 if(t.id==='bell'){bell(t);return}
 if(t.id==='mebtn'){meMenu(t);return}
 if(t.id==='orbifab'||t.id==='orbibtn'){orbi();return}
 if(t.tagName==='A'&&t.closest('.rail'))document.getElementById('app').classList.remove('open');
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette()}if(e.key==='Escape')closeLayer();if(e.key==='Enter'&&e.target.matches('[role=button]'))e.target.click()});
window.addEventListener('hashchange',route);route();

(function(){const bar=document.getElementById('pgbar');if(!bar)return;const th=bar.querySelector('.th');
 function up(){const de=document.documentElement,max=de.scrollHeight-innerHeight,h=bar.clientHeight;bar.classList.toggle('off',max<8);if(max<8)return;const tl=Math.max(36,h*innerHeight/de.scrollHeight);th.style.height=tl+'px';th.style.top=((h-tl)*scrollY/max)+'px'}
 addEventListener('scroll',up,{passive:true});addEventListener('resize',up);new MutationObserver(()=>requestAnimationFrame(up)).observe(document.getElementById('content'),{childList:true,subtree:true});
 let drag=0,y0=0,s0=0;th.addEventListener('pointerdown',e=>{drag=1;y0=e.clientY;s0=scrollY;bar.classList.add('drag');th.setPointerCapture(e.pointerId);e.stopPropagation()});
 th.addEventListener('pointermove',e=>{if(!drag)return;const de=document.documentElement,max=de.scrollHeight-innerHeight,h=bar.clientHeight,tl=th.clientHeight;scrollTo(0,s0+(e.clientY-y0)*max/(h-tl))});
 th.addEventListener('pointerup',()=>{drag=0;bar.classList.remove('drag')});
 bar.addEventListener('click',e=>{if(e.target===th)return;const r=bar.getBoundingClientRect(),max=document.documentElement.scrollHeight-innerHeight;scrollTo({top:max*(e.clientY-r.top)/r.height,behavior:'smooth'})});
 setTimeout(up,400)})();
</script>
