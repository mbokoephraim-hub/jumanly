<!doctype html><html lang='fr'><head><meta charset='utf-8'><link rel='preconnect' href='https://fonts.googleapis.com'><link href='https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap' rel='stylesheet'><style>





:root{--sapin:#0F3F37;--lime:#A6F26B;--creme:#F2EDE5;--feuille:#3DA14F;--menthe:#2FD3A6;--nuit:#0B1A1F;
--neon:#E3F67C;--ardoise:#5B6B68;--brume:#DCE5E1;--menthe-c:#BFEFDF;--lime-c:#E4FAD0;--ambre:#F2B33D;--corail:#E25C4B;
--sig:linear-gradient(135deg,#D9FA72 0%,#7DE36B 50%,#1E9A64 100%);
--prof:linear-gradient(160deg,#0F3F37 0%,#0B1A1F 100%);--ia:linear-gradient(45deg,#0F3F37 0%,#14745F 55%,#2FD3A6 100%);
--orbe:radial-gradient(circle at 38% 32%,#F4FFB8,#A6F26B 45%,#3DA14F)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:1px;overflow:hidden}
body{font-family:Sora,sans-serif;-webkit-font-smoothing:antialiased;color:var(--sapin);font-size:14px;line-height:1.45;background:#0B1A1F}
.ic{display:block;flex:none}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.sb{justify-content:space-between}.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.f1{flex:1;min-width:0}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;flex:none;letter-spacing:-.02em}
.pile{display:inline-flex}.pile .av+.av{margin-left:-8px}
.ent{display:inline-grid;place-items:center;font-weight:700;flex:none;letter-spacing:-.03em}
.barre{border-radius:99px;overflow:hidden;width:100%}.barre i{display:block;height:100%;border-radius:99px}
.card{background:#fff;border-radius:24px;padding:22px}
.card.sm{border-radius:18px;padding:16px}
.dark{background:var(--sapin);color:#fff}
.nuit{background:var(--prof);color:#fff}
.iabg{background:var(--ia);color:#fff}
h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em}
h2{font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.015em}
h3{font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.01em}
.big{font-size:30px;line-height:34px;font-weight:600;letter-spacing:-.03em}
.lab{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.mut{color:var(--ardoise)}.sm{font-size:12px;line-height:17px}.xs{font-size:11px;line-height:15px}
.w5{font-weight:500}.w6{font-weight:600}
.dark .mut,.nuit .mut,.iabg .mut{color:rgba(255,255,255,.66)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:99px;
 font:600 13px Sora;white-space:nowrap;flex:none}
.btn.s{height:32px;padding:0 13px;font-size:12px;gap:6px}
.btn.l{height:48px;padding:0 24px;font-size:14px}
.b-lime{background:var(--lime);color:var(--sapin)}
.b-sapin{background:var(--sapin);color:#fff}
.b-blanc{background:#fff;color:var(--sapin)}
.b-ghost{background:transparent;color:var(--sapin);box-shadow:inset 0 0 0 1.5px var(--brume)}
.b-ghostw{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.btn.f1{flex:1}
.rond{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.rond.s{width:32px;height:32px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;font:500 12.5px Sora;
 background:#fff;color:var(--sapin);box-shadow:inset 0 0 0 1.5px var(--brume);white-space:nowrap;flex:none}
.chip.on{background:var(--sapin);color:#fff;box-shadow:none}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:99px;font:600 11px Sora;white-space:nowrap;flex:none}
.t-lime{background:var(--lime);color:var(--sapin)}.t-neon{background:var(--neon);color:var(--sapin)}
.t-sapin{background:var(--sapin);color:var(--neon)}.t-brume{background:var(--brume);color:var(--sapin)}
.t-menthe{background:var(--menthe-c);color:#0B5E49}.t-blanc{background:#fff;color:var(--sapin)}
.t-up{background:var(--lime-c);color:#1F7A35}.t-down{background:#FBE3DF;color:#B23A2B}
.t-ambre{background:#FCEBC6;color:#8A5A00}.t-line{box-shadow:inset 0 0 0 1.2px currentColor;background:transparent}
.tile{display:grid;place-items:center;flex:none;border-radius:14px}
.champ{white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:99px;background:#fff;color:var(--ardoise);font-size:13px}
.sep{height:1px;background:var(--brume)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.motif{position:absolute;inset:0;background-size:360px;pointer-events:none}

body{font-size:16px;line-height:26px}
.wrap{width:1200px;margin:0 auto}
.sec{padding:96px 0;position:relative;overflow:hidden}
.s-creme{background:var(--creme)}.s-blanc{background:#fff}.s-sapin{background:var(--sapin);color:#fff}.s-nuit{background:var(--prof);color:#fff}
.s-sapin .mut,.s-nuit .mut{color:rgba(255,255,255,.7)}
.display{font-size:56px;line-height:60px;font-weight:600;letter-spacing:-.035em}
.h1s{font-size:36px;line-height:42px;font-weight:600;letter-spacing:-.025em}
.h2s{font-size:24px;line-height:30px;font-weight:500;letter-spacing:-.015em}
.lead{font-size:18px;line-height:28px;color:var(--ardoise)}
.s-sapin .lead,.s-nuit .lead{color:rgba(255,255,255,.75)}
.eyebrow{font-size:13px;line-height:18px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#3DA14F}
.s-sapin .eyebrow,.s-nuit .eyebrow{color:var(--neon)}
.tete{display:flex;flex-direction:column;gap:14px;max-width:760px}
.tete.c{align-items:center;text-align:center;margin:0 auto}
.grille{display:grid;gap:20px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.carte{background:#fff;border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:12px}
.s-blanc .carte{background:var(--creme)}
.s-sapin .carte{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:#fff}
.lien{font-weight:600;color:#3DA14F;display:inline-flex;align-items:center;gap:6px;font-size:15px}
.s-sapin .lien{color:var(--lime)}
.pub-h{height:84px;background:#fff;display:flex;align-items:center;padding:0 120px;gap:28px;position:relative;z-index:3;box-shadow:0 1px 0 #E6E9E7}
.pub-h nav{display:flex;gap:22px;white-space:nowrap;font-size:14.5px;font-weight:500;flex:1}
.pub-h nav span{display:inline-flex;align-items:center;gap:4px}
.pub-h nav .on{color:#0F3F37;box-shadow:0 2px 0 #A6F26B}
.pub-f{background:var(--sapin);color:#fff;padding:72px 0 32px}
.pub-f .mut{color:rgba(255,255,255,.66)}
.pub-f a{display:block;font-size:14px;line-height:30px;color:rgba(255,255,255,.82)}
.cookie{position:fixed}
.acc{background:#fff;border-radius:20px;padding:20px 24px;display:flex;flex-direction:column;gap:8px}
.s-blanc .acc{background:var(--creme)}
.num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:17px;flex:none}
